      - occupied
      - reserved
      - maintenance
      type: string
      description: |-
        * `available` - Available
        * `occupied` - Occupied
        * `reserved` - Reserved
        * `maintenance` - Maintenance
    TokenObtainPair:
      type: object
      properties:
        username:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          readOnly: true
      required:
      - access
      - password
      - refresh
      - username
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          writeOnly: true
      required:
      - access
      - refresh
    UnitEnum:
      enum:
      - kg
      - g
      - l
      - ml
      - pieces
      - boxes
      - cans
      - bottles
      type: string
      description: |-
        * `kg` - Kilograms
        * `g` - Grams
        * `l` - Liters
        * `ml` - Milliliters
        * `pieces` - Pieces
        * `boxes` - Boxes
        * `cans` - Cans
        * `bottles` - Bottles
    User:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        password:
          type: string
          writeOnly: true
          maxLength: 128
      required:
      - id
      - password
      - username
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
